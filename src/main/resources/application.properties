spring.application.name=demo

# \uAE30\uBCF8 \uD504\uB85C\uD30C\uC77C \uC9C0\uC815 (\uC778\uD154\uB9AC\uC81C\uC774\uC5D0\uC11C \uC2E4\uD589 \uC2DC local \uD504\uB85C\uD30C\uC77C \uAE30\uBCF8 \uD65C\uC131\uD654)
spring.profiles.active=local
spring.profiles.include=secret

# JSP \uBDF0 \uB9AC\uC878\uBC84 \uC124\uC815
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# JPA / Hibernate \uACF5\uD1B5
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# HikariCP \uACF5\uD1B5
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=2000

# JWT \uBCF4\uC548
jwt.secret=32432654ewrvwerger6546h457567easretrghtrgrheta24
jwt.access-token.expiration=86400000
jwt.refresh-token.expiration=86400000
jwt.refresh-token.session-expiration=1209600000

# \uD1B0\uCEA3 \uBC0F Multipart \uC6A9\uB7C9
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# \uD30C\uC77C \uC6F9 \uB9E4\uD551 \uACBD\uB85C (\uACF5\uD1B5)
file.profile.url-path=/profileImages/**
file.profile.absolute-path=file:${file.upload-root}profileImageUpload/
file.item.url-path=/itemImages/**
file.item.absolute-path=file:${file.upload-root}itemImageUpload/
file.comment.url-path=/commentImage/**
file.comment.absolute-path=file:${file.upload-root}commentImageUpload/
file.delete-item.url-path=/deleteItemImages/**
file.delete-item.absolute-path=file:${file.upload-root}deleteItemImageUpload/
file.chat.url-path=/chatImages/**
file.chat.absolute-path=file:${file.upload-root}chatImageUpload/

# \uBA54\uC77C \uC124\uC815
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${spring.mail.username}
spring.mail.password=${spring.mail.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# OAuth2 (Google)
spring.security.oauth2.client.registration.google.client-id=${spring.security.oauth2.client.registration.google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${spring.security.oauth2.client.registration.google.client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email, profile
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# OAuth2 (NAVER)
spring.security.oauth2.client.registration.naver.client-id=${spring.security.oauth2.client.registration.naver.client-id}
spring.security.oauth2.client.registration.naver.client-secret=${spring.security.oauth2.client.registration.naver.client-secret}
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8080/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# \uB0A0\uC528 API
weather.api.service-key=${weather.api.service-key}
weather.api.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

# \uB85C\uADF8 \uB808\uBCA8
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.security=DEBUG