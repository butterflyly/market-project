<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-light border-bottom"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container-fluid">
        <a class="navbar-brand" href="/items/list/1">중고거래 플랫폼</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto d-flex align-items-center">

                <li class="nav-item auth-guest" id="nav-register" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/users/register">회원가입</a>
                </li>

                <li class="nav-item auth-guest" id="nav-login" sec:authorize="isAnonymous()">
                    <a th:href="@{/users/login(redirectUrl=${currentUri})}" class="btn btn-outline-primary">로그인</a>
                </li>

                <li class="nav-item dropdown me-2 auth-user" id="nav-notification" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bell fs-5"></i>
                        <!-- 안읽은 알림 개수 배지 (기존 0, 기본 세팅 display:none) -->
                        <span id="notificationBadge" class="position-absolute top-1 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem; display: none;">0</span>
                    </a>
                    <ul id="notificationList" class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="notificationDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                        <li class="dropdown-header border-bottom pb-2 fw-bold d-flex justify-content-between align-items-center">
                            <span>새로운 알림</span>
                            <span id="unreadCountText" class="badge bg-primary rounded-pill">0</span>
                        </li>
                        <!-- 알림이 없을 때 표시되는 아이템 -->
                        <li id="emptyNotification" class="text-center py-4 text-muted">
                            <i class="bi bi-bell-slash fs-3 d-block mb-2"></i>
                            <span class="small">새로운 알림이 없습니다.</span>
                        </li>
                    </ul>
                </li>

                <li class="nav-item auth-user" id="nav-profile-area" sec:authorize="isAuthenticated()">
                    <a class="nav-link d-flex align-items-center gap-2 fw-semibold" href="/users/mypage">
                        <img id="nav-profile-img" src="/images/default-profile.png" class="rounded-circle border" style="width: 28px; height: 28px; object-fit: cover;">
                        <span id="nav-profile-nickname" class="small text-dark" sec:authentication="name">사용자</span>
                    </a>
                </li>
                <li class="nav-item auth-user" id="nav-logout" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="#" role="button" style="cursor: pointer;">로그아웃</a>
                </li>
                <li class="nav-item" id="nav-admin" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-danger fw-bold" href="/admin/dashboard">관리자</a>
                </li>
            </ul>
        </div>
    </div>

    <!--  로그인 상태일 때만 SSE 구독 및 알림 로직 스크립트 실행 -->
    <script sec:authorize="isAuthenticated()">
        document.addEventListener("DOMContentLoaded", function () {
            console.log("🚀 [Notification] 알림 스크립트 초기화 시작");

            // 1. 초기 안읽은 알림 목록 조회
            fetchUnreadNotifications();

            // 2. SSE 연결 시작
            connectSse();
        });

        function fetchUnreadNotifications() {
            console.log("🔍 [Notification] 안읽은 알림 조회 요청 중...");
            fetch("/api/notifications")
                .then(response => response.json())
                .then(res => {
                    console.log("📦 [Notification] 받은 안읽은 알림 데이터:", res);
                    if (res.success && res.data) {
                        // 기존 목록 초기화
                        const notificationList = document.getElementById("notificationList");
                        document.querySelectorAll(".notification-item").forEach(el => el.remove());

                        if (res.data.length > 0) {
                            res.data.forEach(data => addNotificationToDropdown(data, false));
                        }

                        // ⭐️ 배열 길이 기준으로 배지 카운트 일괄 업데이트
                        setBadgeCount(res.data.length);
                    }
                })
                .catch(err => console.error("❌ [Notification] 안읽은 알림 조회 실패:", err));
        }

        function connectSse() {
            console.log("🔌 [Notification] SSE 구독 연결 시도");
            const eventSource = new EventSource("/api/notifications/subscribe");

            eventSource.onopen = function() {
                console.log("✅ [Notification] SSE 연결 성공!");
            };

            eventSource.addEventListener("notification", function (event) {
                console.log("⚡ [Notification] 실시간 알림도착:", event.data);
                try {
                    const notification = JSON.parse(event.data);
                    addNotificationToDropdown(notification, true);

                    // ⭐️ 실시간으로 1개 새로 들어왔을 때만 1 증가
                    incrementBadgeCount(1);
                } catch (e) {
                    console.error("❌ [Notification] 데이터 파싱 에러:", e);
                }
            });

            eventSource.onerror = function (error) {
                console.error("🚨 [Notification] SSE 에러 발생:", error);
            };
        }

        function addNotificationToDropdown(notification, isRealtime) {
            const emptyNotice = document.getElementById("emptyNotification");
            const notificationList = document.getElementById("notificationList");

            if (emptyNotice) {
                emptyNotice.style.display = "none";
            }

            const li = document.createElement("li");
            li.className = "border-bottom notification-item";
            li.dataset.id = notification.id;

            li.innerHTML = `
                <a class="dropdown-item py-2 px-3 text-wrap" href="${notification.targetUrl || '#'}" onclick="markAsRead(${notification.id}, event, '${notification.targetUrl}')">
                    <div class="fw-bold small text-primary mb-1">${getNotificationTitle(notification.type)}</div>
                    <div class="small text-dark mb-1" style="font-size: 0.85rem;">${notification.content}</div>
                    <div class="text-muted text-end" style="font-size: 0.7rem;">${notification.createdAt || '방금 전'}</div>
                </a>
            `;

            const header = notificationList.querySelector(".dropdown-header");
            header.after(li);
        }

        function markAsRead(notificationId, event, targetUrl) {
            event.preventDefault();

            fetch(`/api/notifications/${notificationId}/read`, { method: "PATCH" })
                .then(() => {
                    if (targetUrl && targetUrl !== '#' && targetUrl !== 'null') {
                        location.href = targetUrl;
                    } else {
                        location.reload();
                    }
                })
                .catch(err => console.error("❌ [Notification] 읽음 처리 실패:", err));
        }

        // ⭐️ [추가] 배지 수 정확한 값으로 세팅
        function setBadgeCount(count) {
            const badge = document.getElementById("notificationBadge");
            const countText = document.getElementById("unreadCountText");

            if (countText) countText.textContent = count;

            if (count > 0) {
                badge.textContent = count > 99 ? "99+" : count;
                badge.style.display = "inline-block";
            } else {
                badge.style.display = "none";
                const emptyNotice = document.getElementById("emptyNotification");
                if (emptyNotice) emptyNotice.style.display = "block";
            }
        }

        // ⭐️ [추가] 실시간 수신 시 상대적 가산
        function incrementBadgeCount(amount) {
            const badge = document.getElementById("notificationBadge");
            let currentCount = parseInt(badge.textContent) || 0;
            setBadgeCount(currentCount + amount);
        }

        function getNotificationTitle(type) {
            switch (type) {
                case "ITEM_STATUS_CHANGED": return "📢 상품 상태 변경";
                case "DEAL_CONFIRMED": return "🤝 거래 확정";
                case "CHAT": return "💬 채팅 도착";
                case "SYSTEM": return "🔔 시스템 알림";
                default: return "🔔 알림";
            }
        }
    </script>
</nav>
