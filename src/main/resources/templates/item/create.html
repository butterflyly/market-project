<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>상품 등록</title>

</head>
<body>

<div layout:fragment="content" class="container my-5">

    <form onsubmit="return false;">

        <div id="error-container" class="alert alert-danger" style="display: none;" role="alert">
            <ul id="error-messages" class="mb-0">
            </ul>
        </div>
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" id="title" name="title" class="form-control">
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">가격</label>
            <input type="number" id="price" name="price" class="form-control" min="0" value="0">
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea id="content" name="content" class="form-control" rows="10"></textarea>
        </div>

        <div class="mb-3">
            <label for="images" class="form-label">상품 이미지 (최대 5장)</label>
            <input type="file" id="images" name="images" class="form-control" multiple accept="image/*">
        </div>

        <div class="form-group mb-3">
            <label for="categoryId" class="form-label">카테고리</label>
            <select id="categoryId" name="categoryId" class="form-select">
                <option value="">-- 카테고리 선택 --</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id == selectedCategoryId}">
                    가전제품
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">등록</button>
        </div>
    </form>

    <th:block layout:fragment="script">
        <script src="/js/item/create.js"></script>
    </th:block>

</div>

</body>
</html>
