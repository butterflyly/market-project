<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>관리자 어드민 대시보드</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" type="text/css" href="/css/admin/common.css">
    </th:block>
    <style>
        /* 기존 톤앤매너에 맞춘 마이크로 스타일링 */
        .admin-nav-link {
            transition: all 0.2s ease;
            border-radius: 0.375rem;
        }
        .admin-nav-link:hover, .admin-nav-link.active {
            background-color: #f8f9fa;
            color: #0d6efd !important;
            font-weight: 600;
        }
        .stat-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.08)!important;
        }
    </style>
</head>
<body>

<div layout:fragment="content" class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <span class="badge bg-danger mb-1">ADMIN ONLY</span>
            <h1 class="h2 fw-bold mb-0 text-dark">⚙️ 시스템 통합 대시보드</h1>
        </div>
        <div class="text-muted small">
            <i class="bi bi-shield-fill-check text-success"></i> 최고 관리자 세션 활성화 중
        </div>
    </div>

    <div class="row g-4">

        <div class="col-md-3">
            <div th:replace="~{layout/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card stat-card border-0 shadow-sm p-4 bg-white rounded">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted fw-bold small text-uppercase mb-2">미처리 신고</h6>
                                <div class="d-flex align-items-baseline">
                                    <span class="display-6 fw-bold text-danger me-1" th:text="${pendingReportCount}">0</span>
                                    <span class="text-muted small">건</span>
                                </div>
                            </div>
                            <div class="bg-danger bg-opacity-10 text-danger rounded-circle p-3 fs-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                                <i class="bi bi-bell-fill"></i>
                            </div>
                        </div>
                        <div class="border-top mt-3 pt-2 text-end">
                            <a href="/admin/reports" class="text-decoration-none text-primary fw-medium" style="font-size: 0.85rem;">처리 대기열 이동 ➔</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card border-0 shadow-sm p-4 bg-white rounded">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted fw-bold small text-uppercase mb-2">아카이브 삭제글</h6>
                                <div class="d-flex align-items-baseline">
                                    <span class="display-6 fw-bold text-secondary me-1" th:text="${deletedItemCount}">0</span>
                                    <span class="text-muted small">개</span>
                                </div>
                            </div>
                            <div class="bg-secondary bg-opacity-10 text-secondary rounded-circle p-3 fs-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                                <i class="bi bi-archive-fill"></i>
                            </div>
                        </div>
                        <div class="border-top mt-3 pt-2 text-end">
                            <a href="/admin/items/deleted-list" class="text-decoration-none text-primary fw-medium" style="font-size: 0.85rem;">보관함 열기 ➔</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card border-0 shadow-sm p-4 bg-white rounded">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted fw-bold small text-uppercase mb-2">제재 블랙 유저</h6>
                                <div class="d-flex align-items-baseline">
                                    <span class="display-6 fw-bold text-warning me-1" th:text="${blackUserCount}">0</span>
                                    <span class="text-muted small">명</span>
                                </div>
                            </div>
                            <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 fs-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                                <i class="bi bi-person-x-fill"></i>
                            </div>
                        </div>
                        <div class="border-top mt-3 pt-2 text-end">
                            <a href="/admin/users?tab=BLACK" class="text-decoration-none text-primary fw-medium" style="font-size: 0.85rem;">리스트 모니터링 ➔</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4 bg-white rounded">
                <h5 class="fw-bold text-dark mb-3"><i class="bi bi-info-circle-fill text-primary me-2"></i>어드민 마스터 안내사항</h5>
                <p class="text-secondary mb-0 small" style="line-height: 1.6;">
                    본 대시보드는 중고거래 플랫폼의 실시간 상태를 모니터링하기 위한 관리자 전용 아카이브 공간입니다.<br>
                    좌측 메뉴를 이용하여 <strong>신고된 유해 게시물 처리, 논리 삭제(Soft-Delete)된 게시물 상세 복원/조회, 악성 이용자 제재 관리</strong>를 원스톱으로 처리할 수 있습니다.
                </p>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
    </th:block>
</div>
</body>
</html>
