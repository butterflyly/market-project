<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>👑 어드민 - 유저 제재 & 아카이브 센터</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" type="text/css" href="/css/admin/common.css">
    </th:block>
</head>
<body>

<div layout:fragment="content" class="container my-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{layout/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <div>
                    <h1 class="h3 mb-1 text-dark fw-bold"><i class="bi bi-people-fill text-primary"></i> 유저 관리 및 권한 제재 센터</h1>
                    <small class="text-muted">블랙리스트 회원 및 탈퇴(소프트 삭제) 유저들을 통합 추적하고 복구 민원을 처리하는 공간입니다.</small>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4 bg-white">
                <div class="card-body p-3 bg-light rounded border">
                    <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-center">
                        <input type="hidden" name="tab" th:value="${currentTab}">
                        <div class="col-md-9">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" name="keyword" th:value="${keyword}"
                                       class="form-error-ignore form-control border-start-0 ps-0"
                                       placeholder="고객센터 접수용 이메일, 계정 ID, 혹은 유저 닉네임을 입력해 검색하세요...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100 fw-bold"><i class="bi bi-funnel-fill"></i> 통합 필터 검색</button>
                        </div>
                    </form>
                </div>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a th:href="@{/admin/users(tab='ALL', keyword=${keyword})}"
                       class="nav-link fw-bold px-4"
                       th:classappend="${currentTab == 'ALL'} ? 'active text-primary' : 'text-secondary'">
                        📦 전체 대상 관리 <span class="badge bg-dark ms-1" th:if="${currentTab == 'ALL'}" th:text="${users.totalElements}">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/users(tab='BLACK', keyword=${keyword})}"
                       class="nav-link fw-bold px-4"
                       th:classappend="${currentTab == 'BLACK'} ? 'active text-danger' : 'text-secondary'">
                        🚫 블랙 유저 명단 <span class="badge bg-danger ms-1" th:if="${currentTab == 'BLACK'}" th:text="${users.totalElements}">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/users(tab='DELETED', keyword=${keyword})}"
                       class="nav-link fw-bold px-4"
                       th:classappend="${currentTab == 'DELETED'} ? 'active text-warning text-dark' : 'text-secondary'">
                        🗑️ 소프트 삭제(탈퇴) <span class="badge bg-warning text-dark ms-1" th:if="${currentTab == 'DELETED'}" th:text="${users.totalElements}">0</span>
                    </a>
                </li>
            </ul>

            <div class="table-responsive shadow-sm rounded border bg-white">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th style="width: 8%;">회원 번호</th>
                        <th style="width: 15%;">계정 ID</th>
                        <th style="width: 15%;">닉네임</th>
                        <th style="width: 22%;">이메일 주소</th>
                        <th style="width: 10%;">경고 횟수</th>
                        <th style="width: 12%;">상태 권한</th>
                        <th style="width: 18%;" class="text-center">모니터링</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users.content}">
                        <td th:text="${user.id}" class="text-secondary fw-bold">1</td>
                        <td>
                            <a th:href="@{|/admin/users/detail/${user.id}|}"
                               class="text-decoration-none fw-bold text-dark" th:text="${user.username}">user123</a>
                        </td>
                        <td th:text="${user.nickname}" class="fw-semibold">닉네임</td>
                        <td th:text="${user.email}" class="text-muted font-monospace">test@gmail.com</td>
                        <td>
                            <span class="badge rounded-pill bg-outline-danger border border-danger text-danger px-3 py-1 fw-bold"
                                  th:classappend="${user.warningCount >= 3} ? 'bg-danger text-white'"
                                  th:text="|${user.warningCount}회|">0회</span>
                        </td>
                        <td>
                            <span class="badge bg-dark p-2" th:if="${user.deleted}">🗑️ 소프트삭제</span>
                            <th:block th:if="${!user.deleted}">
                                <span class="badge bg-danger p-2" th:if="${user.role.name() == 'Black'}">🚫 블랙 회원</span>
                                <span class="badge bg-success p-2" th:if="${user.role.name() == 'NORMAL'}">✅ 일반 회원</span>
                                <span class="badge bg-primary p-2" th:if="${user.role.name() == 'ADMIN'}">👑 관리자</span>
                            </th:block>
                        </td>
                        <td class="text-center">
                            <a th:href="@{|/admin/users/detail/${user.id}|}" class="btn btn-sm btn-outline-dark fw-bold px-3">
                                <i class="bi bi-search"></i> 상세 검토 ➔
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${users.totalPages > 1}" class="d-flex justify-content-center mt-5">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users(page=${users.number - 1}, tab=${currentTab}, keyword=${keyword})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageIdx : ${#numbers.sequence(0, users.totalPages - 1)}"
                            th:if="${pageIdx >= users.number - 2 and pageIdx <= users.number + 2}"
                            class="page-item" th:classappend="${pageIdx == users.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/users(page=${pageIdx}, tab=${currentTab}, keyword=${keyword})}" th:text="${pageIdx + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users(page=${users.number + 1}, tab=${currentTab}, keyword=${keyword})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
