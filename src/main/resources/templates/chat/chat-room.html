<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>채팅방</title>
</head>

<div layout:fragment="content" class="container chat-container my-4">
    <!--
      리액트가 마운트될 root
      이제 백엔드 REST API에서 상세 데이터(title, partner 등)를 받아오므로
      여기서는 roomId만 전달해주면 됩니다!
    -->
    <div id="react-chat-root" th:data-room-id="${roomId}"></div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        const currentLoginUsername = /*[[${#authentication.name}]]*/ 'anonymous';
    </script>
    <script src="/js/react/chat-bundle.js"></script>
</th:block>
</html>
