<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>비밀번호 변경</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" type="text/css" href="/css/users/user-common.css">
    </th:block>
</head>

<div layout:fragment="content" class="container my-5">
    <div class="auth-card" style="max-width: 450px; margin: 0 auto;">
        <h3 class="register-title">비밀번호 변경</h3>
        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            안전을 위해 현재 비밀번호와 새 비밀번호를 입력해주세요.
        </p>

        <form id="passwordForm">
            <div id="error-container" class="alert alert-danger" style="display: none;" role="alert">
                <ul id="error-messages" class="mb-0"></ul>
            </div>

            <div class="form-group mb-3">
                <label class="form-label fw-bold">현재 비밀번호</label>
                <input type="password" id="currentPassword" class="auth-input" placeholder="현재 비밀번호 입력" required>
            </div>

            <hr class="my-4">

            <div class="form-group mb-3">
                <label class="form-label fw-bold">새 비밀번호</label>
                <input type="password" id="newPassword" class="auth-input" placeholder="새 비밀번호 입력" required>
                <div id="newPasswordError" class="msg-error" style="display:none; color: #dc3545; font-size: 13px; margin-top: 5px;"></div>
            </div>

            <div class="form-group mb-4">
                <label class="form-label fw-bold">새 비밀번호 확인</label>
                <input type="password" id="confirmNewPassword" class="auth-input" placeholder="새 비밀번호 다시 입력" required>
                <div id="confirmPasswordError" class="msg-error" style="display:none; color: #dc3545; font-size: 13px; margin-top: 5px;"></div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary py-2">비밀번호 변경</button>
                <a href="/users/mypage" class="btn btn-outline-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
<th:block layout:fragment="script">
    <script src="/js/users/passwordUpdate.js"></script>
</th:block>
</html>
