<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>프로필 수정</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" type="text/css" href="/css/users/user-common.css">
    </th:block>
</head>

<div layout:fragment="content" class="container my-5">
    <div class="auth-card" style="max-width: 450px; margin: 0 auto;">
        <h3 class="register-title">프로필 수정</h3>

        <div class="text-center mb-4">
            <div class="position-relative d-inline-block">
                <img id="profilePreview"
                     th:src="${user.profileUrl != null ? user.profileUrl : '/images/default-profile.png'}"
                     class="rounded-circle border shadow-sm"
                     style="width: 120px; height: 120px; object-fit: cover;">

                <label for="profileImage" class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="profileImage" name="profileImage" accept="image/*"
                       style="display: none;" onchange="previewProfileImage(this)">
            </div>
            <p class="text-muted small mt-2">프로필 사진 변경</p>
        </div>

        <form id="updateForm">

            <div id="error-container" class="alert alert-danger" style="display: none;" role="alert">
                <ul id="error-messages" class="mb-0">
                </ul>
            </div>

            <div class="form-group mb-4">
                <label class="form-label fw-bold">닉네임</label>
                <input type="text" id="nickname" class="auth-input" th:value="${user.nickname}" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">저장하기</button>
                <a href="/users/mypage" class="btn btn-link text-secondary">마이페이지로 돌아가기</a>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="script">
    <script src="/js/users/user_update.js"></script>
</th:block>
</html>
